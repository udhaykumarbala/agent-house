<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>UnitShift — Unit Converter</title>
  <meta name="description" content="Premium minimal unit converter for length, weight, and temperature." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-BiIY5Mot.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DZGL9VeB.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <span class="app-title">UnitShift</span>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to light mode"
      >
        <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="4"/>
          <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.93 3.93l1.41 1.41M14.66 14.66l1.41 1.41M3.93 16.07l1.41-1.41M14.66 5.34l1.41-1.41"/>
        </svg>
        <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M17.5 10.47A7.5 7.5 0 1 1 9.53 2.5a5.5 5.5 0 0 0 7.97 7.97z"/>
        </svg>
      </button>
    </header>

    <nav class="tabs-container" aria-label="Conversion category">
      <div class="tabs-track" role="tablist">
        <div class="tab-pill" aria-hidden="true"></div>
        <button class="tab" role="tab" aria-selected="true" tabindex="0" id="tab-length" aria-controls="converter-panel" data-category="length">Length</button>
        <button class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-weight" aria-controls="converter-panel" data-category="weight">Weight</button>
        <button class="tab" role="tab" aria-selected="false" tabindex="-1" id="tab-temperature" aria-controls="converter-panel" data-category="temperature">
          <span class="tab-full">Temperature</span>
          <span class="tab-short">Temp</span>
        </button>
      </div>
    </nav>

    <main class="converter" id="converter-panel" role="tabpanel" aria-labelledby="tab-length">
      <section class="card card-from" aria-label="Convert from">
        <label class="card-label" id="from-label" for="from-input">FROM</label>
        <div class="pill-row" role="radiogroup" aria-label="Source unit" id="from-pills"></div>
        <div class="value-row">
          <input
            type="text"
            inputmode="decimal"
            class="value-input"
            id="from-input"
            placeholder="Type a value..."
            aria-label="Value to convert from"
            autocomplete="off"
          />
          <span class="unit-symbol" id="from-symbol" aria-hidden="true"></span>
        </div>
      </section>

      <div class="swap-wrapper">
        <button class="swap-btn" id="swap-btn" type="button" aria-label="Swap conversion direction">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 3v14M10 3l-4 4M10 3l4 4M10 17l-4-4M10 17l4-4"/>
          </svg>
        </button>
      </div>

      <section class="card card-to" aria-label="Convert to">
        <label class="card-label" id="to-label" for="to-input">TO</label>
        <div class="pill-row" role="radiogroup" aria-label="Target unit" id="to-pills"></div>
        <div class="value-row">
          <input
            type="text"
            inputmode="decimal"
            class="value-result"
            id="to-input"
            placeholder="—"
            aria-label="Converted result"
            autocomplete="off"
          />
          <span class="unit-symbol" id="to-symbol" aria-hidden="true"></span>
        </div>
        <p class="quick-ref" id="quick-ref" aria-hidden="true"></p>
      </section>
    </main>

    <div id="sr-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>

</body>
</html>
