<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7C3AED">
  <meta name="description" content="Never run out of supplies again - get smart alerts before stock runs low.">
  <title>Reorder Alert - Inventory Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%237C3AED' rx='15' width='100' height='100'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='50'>📦</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="auth-container">
        <div class="auth-logo">
          <div class="logo-icon">📦</div>
          <h1 class="logo-text">Reorder Alert</h1>
        </div>
        <p class="auth-tagline">Never run out of supplies again</p>

        <form id="auth-form" class="auth-form">
          <div class="input-group">
            <label class="input-label" for="auth-email">Email</label>
            <input class="input" type="email" id="auth-email" placeholder="you@example.com" required>
          </div>
          <div class="input-group">
            <label class="input-label" for="auth-password">Password</label>
            <div class="input-password-wrapper">
              <input class="input" type="password" id="auth-password" placeholder="Enter password" required minlength="6">
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full" id="auth-submit">Log In</button>
          <p class="auth-forgot"><a href="#" id="forgot-link">Forgot password?</a></p>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button class="btn-secondary btn-full" id="auth-switch">Create Account</button>
      </div>
    </div>

    <!-- Main App Container (hidden until logged in) -->
    <div id="main-app" class="hidden">
      <!-- Header -->
      <header class="header">
        <button class="btn-icon" id="menu-btn" aria-label="Menu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="header-title" id="page-title">Dashboard</h1>
        <button class="btn-icon" id="user-btn" aria-label="User profile">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </header>

      <!-- Page Container -->
      <main class="main-content">
        <!-- Dashboard Page -->
        <div id="page-dashboard" class="page active">
          <div id="dashboard-content"></div>
        </div>

        <!-- Items Page -->
        <div id="page-items" class="page">
          <div id="items-content"></div>
        </div>

        <!-- Alerts Page -->
        <div id="page-alerts" class="page">
          <div id="alerts-content"></div>
        </div>

        <!-- Settings Page -->
        <div id="page-settings" class="page">
          <div id="settings-content"></div>
        </div>

        <!-- Item Detail Page -->
        <div id="page-item-detail" class="page">
          <div id="item-detail-content"></div>
        </div>

        <!-- Add/Edit Item Page -->
        <div id="page-item-form" class="page">
          <div id="item-form-content"></div>
        </div>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item active" data-page="dashboard">
          <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="bottom-nav-item" data-page="items">
          <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>Items</span>
        </a>
        <a href="#" class="bottom-nav-item" data-page="alerts" id="nav-alerts">
          <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Alerts</span>
          <span class="bottom-nav-badge hidden" id="alert-badge">0</span>
        </a>
        <a href="#" class="bottom-nav-item" data-page="settings">
          <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Floating Action Button -->
      <button class="fab" id="fab-add" aria-label="Add new item">
        <svg class="fab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Quick Update Bottom Sheet -->
    <div class="bottom-sheet-overlay" id="quick-update-overlay"></div>
    <div class="bottom-sheet" id="quick-update-sheet">
      <div class="bottom-sheet-handle"></div>
      <div id="quick-update-content"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
      <svg class="toast-icon" id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toast-message">Success</span>
    </div>

    <!-- Confirm Dialog -->
    <div class="dialog-overlay hidden" id="confirm-dialog">
      <div class="dialog">
        <h3 class="dialog-title" id="dialog-title">Confirm Action</h3>
        <p class="dialog-message" id="dialog-message">Are you sure?</p>
        <div class="dialog-actions">
          <button class="btn-secondary" id="dialog-cancel">Cancel</button>
          <button class="btn-primary btn-danger" id="dialog-confirm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
