version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: subtrack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subtrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subtrack-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/subtrack?sslmode=disable
      SESSION_SECRET: development-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
      PORT: 8080
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subtrack-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
